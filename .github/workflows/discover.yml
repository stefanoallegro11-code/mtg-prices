name: Scoperte

on:
  schedule:
    - cron: "35 1-21/4 * * *"   # ricerca completa ogni 4 ore, prima del messaggio Telegram delle scoperte
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/discover.py
      - .github/trigger/discover   # file "interruttore" per rilanciare a mano

permissions:
  contents: write

concurrency:
  group: cardtrader-api        # mai in contemporanea con "Aggiorna prezzi"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Data per la cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache indice CardTrader
        uses: actions/cache@v4
        with:
          path: .cache
          key: ct-index-${{ steps.day.outputs.day }}
          restore-keys: ct-index-

      - name: Cerca scoperte
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 scripts/discover.py

      - name: Salva i risultati
        run: |
          git config user.name "mtg-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discoveries.json data/discoveries_seen.json data/discoveries_watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scoperte aggiornate $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
