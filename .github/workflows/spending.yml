name: Spesa CardTrader

on:
  workflow_dispatch: {}        # solo a mano: "Run workflow"

permissions:
  contents: write

concurrency:
  group: cardtrader-api        # mai in contemporanea con gli altri controlli CardTrader
  cancel-in-progress: false

jobs:
  spending:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Calcola la spesa su CardTrader
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 scripts/spending.py

      - name: Salva i risultati
        run: |
          git config user.name "mtg-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spending.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Spesa CardTrader aggiornata $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
