name: Scoperte su Telegram

on:
  schedule:
    - cron: "41 2-22/4 * * *"   # ogni 4 ore, solo le scoperte nuove
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Invia le scoperte nuove
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_digest.py scoperte
      - name: Salva lo stato
        run: |
          git config user.name "mtg-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stato Telegram aggiornato $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
