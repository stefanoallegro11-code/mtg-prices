name: Occasioni su Telegram

on:
  schedule:
    - cron: "41 */4 * * *"   # ogni 4 ore (in Italia: 2:41, 6:41, 10:41, 14:41, 18:41, 22:41 con l'ora legale)
  workflow_dispatch: {}       # "Run workflow" per mandare il messaggio subito

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Invia riepilogo occasioni
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_digest.py
