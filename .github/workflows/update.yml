name: Aggiorna prezzi

on:
  schedule:
    - cron: "5 * * * *"   # ogni ora; giro completo (EN+JP) ogni 4 ore, negli altri JP solo dove serve
  workflow_dispatch: {}       # pulsante "Run workflow" / "Aggiorna ora" dalla pagina
  push:
    branches: [main]
    paths:
      - cards.txt             # lista modificata -> aggiorna subito
      - scripts/update_prices.py
      - .github/trigger/update   # file "interruttore": modificandolo si rilancia a mano

permissions:
  contents: write

concurrency:
  group: cardtrader-api        # mai in contemporanea con "Scoperte"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Data per la cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache indice CardTrader (1 volta al giorno)
        uses: actions/cache@v4
        with:
          path: .cache
          key: ct-index-${{ steps.day.outputs.day }}
          restore-keys: ct-index-

      - name: Aggiorna i prezzi
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          FULL_RUN: ${{ github.event_name != 'schedule' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/update_prices.py

      - name: Salva i risultati
        run: |
          git config user.name "mtg-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "Prezzi aggiornati $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
